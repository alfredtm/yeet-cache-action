name: 'Yeet Cache'
description: 'Content-addressed CI build skip via OCI registry. Skip image builds entirely when source files are unchanged.'
author: 'alfredtm'
branding:
  icon: 'fast-forward'
  color: 'purple'

inputs:
  paths:
    description: 'Space-separated paths to hash via git tree hashes. Required unless `hash` is provided.'
    required: false
    default: ''
  hash:
    description: 'Pre-computed 12-char source hash. Bypasses paths/git. Useful for skipping checkout on cache hits.'
    required: false
    default: ''
  image:
    description: 'OCI image repository without tag (e.g. ghcr.io/owner/repo).'
    required: true
  extra:
    description: 'Free-form string mixed into the hash. Include build flags, toolchain version, base image digest.'
    required: false
    default: ''
  registry:
    description: 'Registry hostname.'
    required: false
    default: 'ghcr.io'
  registry-username:
    description: 'Registry username. Defaults to $GITHUB_ACTOR.'
    required: false
    default: ''
  registry-password:
    description: 'Registry token. Typically secrets.GITHUB_TOKEN.'
    required: true
  tags:
    description: 'Comma-separated tags to apply on cache hit.'
    required: false
    default: ''
  sign:
    description: '"true" to verify GitHub attestation on cache hit and auto-attest the built image on cache miss (post hook). Requires permissions { id-token: write, attestations: write }.'
    required: false
    default: 'false'
  verify-identity:
    description: 'Override for the workflow identity regex used during verification. Defaults to any workflow in $GITHUB_REPOSITORY.'
    required: false
    default: ''
  yeet-pack-binary-path:
    description: 'Override path to the yeet-pack binary. Defaults to the bundled binary in dist/.'
    required: false
    default: ''

outputs:
  hit:
    description: '"true" if an image with the source hash exists (and signature verified, if sign=true).'
  src-hash:
    description: '12-char content address.'
  src-tag:
    description: 'Full <image>:src-<hash> reference. Tag your freshly-built image with this on cache miss.'
  cached-tag:
    description: 'Same as src-tag, only set on cache hit.'

runs:
  using: 'node20'
  main: 'dist/main.js'
  post: 'dist/post.js'
