name: 'Yeet Cache'
description: 'Content-addressed CI build skip via OCI registry. Skip image builds entirely when source files are unchanged.'
author: 'alfredtm'
branding:
  icon: 'fast-forward'
  color: 'purple'

inputs:
  paths:
    description: 'Space-separated list of paths to hash (e.g. "cmd internal go.mod go.sum"). Uses git tree hashes — each path must exist in HEAD.'
    required: true
  image:
    description: 'OCI image repository without tag (e.g. ghcr.io/owner/repo).'
    required: true
  extra:
    description: 'Arbitrary string mixed into the cache hash. Include anything that affects build output but is not in `paths`: Go version, build flags, base image digest, target OS/arch. Strongly recommended for correctness.'
    required: false
    default: ''
  registry:
    description: 'Registry hostname for login.'
    required: false
    default: 'ghcr.io'
  registry-username:
    description: 'Username for registry login. Defaults to $GITHUB_ACTOR.'
    required: false
    default: ''
  registry-password:
    description: 'Password or token for registry login. Typically secrets.GITHUB_TOKEN.'
    required: true
  tags:
    description: 'Comma-separated tags to apply when cache hits (e.g. "$GITHUB_SHA,latest"). Skipped on cache miss — caller is responsible for tagging the freshly-built image with the src-tag output.'
    required: false
    default: ''
  sign:
    description: 'When "true", verify cosign keyless signature on cache hit before retagging. Use yeet-cache-action/sign@v1 after build to populate signed entries. Caller workflow must declare permissions { id-token: write }.'
    required: false
    default: 'false'
  verify-identity:
    description: 'Regex passed to cosign --certificate-identity-regexp. Defaults to any workflow in $GITHUB_REPOSITORY.'
    required: false
    default: ''
  crane-version:
    description: 'Crane version (e.g. v0.20.2) or "latest".'
    required: false
    default: 'latest'
  cosign-version:
    description: 'Cosign version (e.g. v2.4.1) or "latest". Used only when sign=true.'
    required: false
    default: 'v2.4.1'

outputs:
  hit:
    description: '"true" if an image with the computed source hash exists in the registry (and signature verified, when sign=true).'
    value: ${{ steps.check.outputs.hit }}
  src-hash:
    description: '12-char content address derived from paths + extra.'
    value: ${{ steps.check.outputs.src-hash }}
  src-tag:
    description: 'Full <image>:src-<hash> reference. Tag your freshly-built image with this on cache miss to populate the cache.'
    value: ${{ steps.check.outputs.src-tag }}
  cached-tag:
    description: 'Same as src-tag, but only set on cache hit.'
    value: ${{ steps.check.outputs.cached-tag }}

runs:
  using: 'composite'
  steps:
    - name: Cache crane binary
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/crane
        key: yeet-crane-${{ inputs.crane-version }}-linux-amd64

    - name: Install crane
      shell: bash
      env:
        CRANE_VERSION: ${{ inputs.crane-version }}
      run: |
        if [ -x /usr/local/bin/crane ]; then
          echo "crane restored from cache: $(crane version 2>&1 | head -1)"
          exit 0
        fi
        if [ "$CRANE_VERSION" = "latest" ]; then
          URL="https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz"
        else
          URL="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
        fi
        curl -sL "$URL" | tar xz crane
        sudo mv crane /usr/local/bin/
        crane version

    - name: Login to registry
      shell: bash
      env:
        REG: ${{ inputs.registry }}
        REG_USER: ${{ inputs.registry-username }}
        REG_PASS: ${{ inputs.registry-password }}
      run: |
        USER="${REG_USER:-$GITHUB_ACTOR}"
        echo "$REG_PASS" | crane auth login "$REG" -u "$USER" --password-stdin

    - name: Compute source hash and check registry
      id: check
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PATHS: ${{ inputs.paths }}
        EXTRA: ${{ inputs.extra }}
      run: |
        REFS=""
        for p in $PATHS; do
          REFS="$REFS HEAD:$p"
        done

        if ! TREE_HASHES=$(git rev-parse $REFS 2>&1); then
          echo "::error::failed to compute git tree hashes for: $PATHS"
          echo "$TREE_HASHES"
          exit 1
        fi

        # Mix `extra` into the hash so build flags / toolchain version / base
        # image digest can also invalidate the cache.
        HASH=$( (printf '%s\n' "$TREE_HASHES"; printf 'extra:%s\n' "$EXTRA") | sha256sum | cut -c1-12 )

        SRC_TAG="${IMAGE}:src-${HASH}"

        {
          echo "src-hash=$HASH"
          echo "src-tag=$SRC_TAG"
        } >> "$GITHUB_OUTPUT"

        echo "::notice::source hash = $HASH"
        if [ -n "$EXTRA" ]; then
          echo "  (extra: $EXTRA)"
        fi

        if crane manifest "$SRC_TAG" >/dev/null 2>&1; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "cached-tag=$SRC_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::CACHE HIT — $SRC_TAG"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "::notice::cache miss — $SRC_TAG not in registry"
        fi

    - name: Install cosign
      if: steps.check.outputs.hit == 'true' && inputs.sign == 'true'
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Verify cosign signature
      if: steps.check.outputs.hit == 'true' && inputs.sign == 'true'
      shell: bash
      env:
        SRC_TAG: ${{ steps.check.outputs.cached-tag }}
        IDENTITY: ${{ inputs.verify-identity }}
      run: |
        START=$(date +%s%N)
        IDENT="${IDENTITY:-^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.+$}"
        echo "verifying $SRC_TAG against identity $IDENT"
        if ! cosign verify \
          --certificate-identity-regexp "$IDENT" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "$SRC_TAG" >/dev/null 2>&1; then
          echo "::error::cache image $SRC_TAG failed cosign verification."
          echo "::error::This means the cache was either tampered with, built before signing was enabled,"
          echo "::error::or built by an unexpected workflow identity. Refusing to retag."
          exit 1
        fi
        END=$(date +%s%N)
        echo "::notice::signature verified in $(( (END - START) / 1000000 ))ms"

    - name: Promote cached image to additional tags
      if: steps.check.outputs.hit == 'true' && inputs.tags != ''
      shell: bash
      env:
        SRC_TAG: ${{ steps.check.outputs.cached-tag }}
        TAGS: ${{ inputs.tags }}
      run: |
        START=$(date +%s%N)
        IFS=',' read -ra TAG_ARR <<< "$TAGS"
        for t in "${TAG_ARR[@]}"; do
          t="$(echo "$t" | tr -d '[:space:]')"
          [ -z "$t" ] && continue
          echo "tagging cached image as $t"
          crane tag "$SRC_TAG" "$t"
        done
        END=$(date +%s%N)
        echo "::notice::yeet-cache promoted in $(( (END - START) / 1000000 ))ms"
