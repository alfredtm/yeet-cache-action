name: 'Yeet Cache: sign'
description: 'Sign a content-addressed cache image with cosign keyless. Use after a cache-miss build so the next run with the same source can verify the cached image is trustworthy.'
author: 'alfredtm'
branding:
  icon: 'lock'
  color: 'purple'

inputs:
  src-tag:
    description: 'Full image reference to sign (e.g. ghcr.io/owner/repo:src-aabf3d55da34). Typically the src-tag output of the parent yeet-cache-action.'
    required: true
  registry:
    description: 'Registry hostname for login.'
    required: false
    default: 'ghcr.io'
  registry-username:
    description: 'Username for registry login. Defaults to $GITHUB_ACTOR.'
    required: false
    default: ''
  registry-password:
    description: 'Password or token. Typically secrets.GITHUB_TOKEN.'
    required: true
  cosign-version:
    description: 'Cosign version (e.g. v2.4.1) or "latest".'
    required: false
    default: 'v2.4.1'

runs:
  using: 'composite'
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Authenticate cosign with registry
      shell: bash
      env:
        REG: ${{ inputs.registry }}
        REG_USER: ${{ inputs.registry-username }}
        REG_PASS: ${{ inputs.registry-password }}
      run: |
        USER="${REG_USER:-$GITHUB_ACTOR}"
        cosign login "$REG" -u "$USER" -p "$REG_PASS"

    - name: Sign with cosign keyless (OIDC)
      shell: bash
      env:
        SRC_TAG: ${{ inputs.src-tag }}
      run: |
        START=$(date +%s%N)
        echo "::notice::signing $SRC_TAG (cosign keyless via GitHub OIDC)"
        cosign sign --yes "$SRC_TAG"
        END=$(date +%s%N)
        echo "::notice::cosign sign took $(( (END - START) / 1000000 ))ms"
