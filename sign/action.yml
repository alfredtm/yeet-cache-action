name: 'Yeet Cache: sign'
description: 'Sign a content-addressed cache image with cosign keyless. Use after a cache-miss build so the next run can verify the cached image is trustworthy.'
author: 'alfredtm'
branding:
  icon: 'lock'
  color: 'purple'

inputs:
  src-tag:
    description: 'Full image reference to sign (e.g. ghcr.io/owner/repo:src-aabf3d55da34).'
    required: true
  registry:
    description: 'Registry hostname for login.'
    required: false
    default: 'ghcr.io'
  registry-username:
    description: 'Username for registry login. Defaults to $GITHUB_ACTOR.'
    required: false
    default: ''
  registry-password:
    description: 'Password or token.'
    required: true
  cosign-version:
    description: 'Cosign version (e.g. v2.4.1).'
    required: false
    default: 'v2.4.1'

runs:
  using: 'composite'
  steps:
    - name: Cache cosign binary
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/cosign
        key: yeet-cosign-${{ inputs.cosign-version }}-linux-amd64

    - name: Install cosign
      shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.cosign-version }}
      run: |
        if [ -x /usr/local/bin/cosign ]; then
          echo "cosign restored: $(cosign version 2>&1 | head -1)"
          exit 0
        fi
        curl -sL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /tmp/cosign
        chmod +x /tmp/cosign
        sudo mv /tmp/cosign /usr/local/bin/cosign
        cosign version

    - name: Authenticate cosign with registry
      shell: bash
      env:
        REG: ${{ inputs.registry }}
        REG_USER: ${{ inputs.registry-username }}
        REG_PASS: ${{ inputs.registry-password }}
      run: |
        USER="${REG_USER:-$GITHUB_ACTOR}"
        cosign login "$REG" -u "$USER" -p "$REG_PASS"

    - name: Sign with cosign keyless (OIDC)
      shell: bash
      env:
        SRC_TAG: ${{ inputs.src-tag }}
      run: |
        START=$(date +%s%N)
        cosign sign --yes "$SRC_TAG"
        END=$(date +%s%N)
        echo "::notice::cosign sign took $(( (END - START) / 1000000 ))ms"
